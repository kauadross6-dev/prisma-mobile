<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
let dificuldadeEscolhida = 'facil';
let numeroEscolhido = 3;
let explicacaoAtual = '';
let personalidadeEscolhida = 'padrao';

// =====================
// MEMÓRIA LOCAL (localStorage)
// =====================
const LS_MEM = 'prisma_mem_v1';
const LS_MURAL = 'prisma_mural_v1';
const LS_HUMOR = 'prisma_humor_v1';

function lsGet(k, padrao) {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; }
    catch { return padrao; }
}
function lsSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
}

let memoria = lsGet(LS_MEM, { nome: '', gostos: '', personalidade: 'padrao', historico: [] });
let mural = lsGet(LS_MURAL, []);
let humor = lsGet(LS_HUMOR, []);

function dataAgora() {
    const d = new Date();
    return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

// =====================
// AUTO-APRENDIZADO (NOVO)
// =====================
function autoAprender(texto) {
    const t = texto.toLowerCase().trim();

    // Detecta "meu nome é X"
    let match = t.match(/meu nome (?:é|e)\s+(.+)/);
    if (match) {
        const nome = match[1].trim().replace(/[.!?,]$/, '');
        memoria.nome = nome.charAt(0).toUpperCase() + nome.slice(1);
        lsSet(LS_MEM, memoria);
        return;
    }

    // Detecta "eu gosto de X"
    match = t.match(/eu gosto de\s+(.+)/);
    if (match) {
        const gosto = match[1].trim().replace(/[.!?,]$/, '');
        const atuais = memoria.gostos ? memoria.gostos.split(',').map(g => g.trim()) : [];
        if (!atuais.includes(gosto)) {
            atuais.push(gosto);
            memoria.gostos = atuais.join(', ');
            lsSet(LS_MEM, memoria);
        }
    }
}

// =====================
// CHAT
// =====================
function adicionarMsg(texto, classe) {
    const d = document.createElement('div');
    d.className = 'msg ' + classe; d.textContent = texto;
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function adicionarDigitando() {
    const d = document.createElement('div');
    d.className = 'msg prisma digitando'; d.id = 'digitando';
    d.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function removerDigitando() { const e = document.getElementById('digitando'); if (e) e.remove(); }

async function enviar() {
    const t = input.value.trim(); if (!t) return;
    adicionarMsg(t, 'usuario'); input.value = ''; adicionarDigitando();

    // Auto-aprendizado ANTES de enviar
    autoAprender(t);

    // Salva no histórico local
    memoria.historico.push({ role: 'user', content: t });
    if (memoria.historico.length > 20) memoria.historico = memoria.historico.slice(-20);
    lsSet(LS_MEM, memoria);

    try {
        const r = await fetch('/api/chat', { method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                mensagem: t,
                nome: memoria.nome,
                gostos: memoria.gostos,
                personalidade: memoria.personalidade,
                historico: memoria.historico.slice(-6)
            }) });
        const d = await r.json();
        removerDigitando();
        adicionarMsg(d.resposta, 'prisma');

        memoria.historico.push({ role: 'assistant', content: d.resposta });
        if (memoria.historico.length > 20) memoria.historico = memoria.historico.slice(-20);
        lsSet(LS_MEM, memoria);
    } catch (e) {
        removerDigitando();
        adicionarMsg('❌ Erro de conexão.', 'sistema');
    }
}

function falar() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        adicionarMsg('⚠️ Navegador sem suporte a voz.', 'sistema'); return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR(); rec.lang = 'pt-BR';
    rec.onresult = e => { input.value = e.results[0][0].transcript; enviar(); };
    rec.onerror = () => adicionarMsg('❌ Não consegui ouvir.', 'sistema');
    rec.start(); adicionarMsg('🎤 Ouvindo...', 'sistema');
}

// =====================
// QUIZ
// =====================
function abrirQuiz() { document.getElementById('modalQuiz').classList.add('aberto'); }
function escolherDificuldade(d) { dificuldadeEscolhida = d;
    ['facil','medio','dificil'].forEach(x => document.getElementById('dif-'+x).classList.toggle('selecionado', x===d)); }
function escolherNumero(n) { numeroEscolhido = n;
    [3,5,10].forEach(x => document.getElementById('num-'+x).classList.toggle('selecionado', x===n)); }

function falarQuiz() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR(); rec.lang = 'pt-BR';
    rec.onresult = e => document.getElementById('quizTema').value = e.results[0][0].transcript;
    rec.start();
}

async function gerarQuiz() {
    const tema = document.getElementById('quizTema').value.trim();
    if (!tema) { alert('Digite um tema!'); return; }
    const c = document.getElementById('quizConteudo');
    c.innerHTML = '<div class="carregando"><div class="spinner"></div><div>Gerando...</div></div>';
    try {
        const r = await fetch('/api/quiz/gerar', { method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({tema, dificuldade: dificuldadeEscolhida, numero: numeroEscolhido}) });
        const d = await r.json();
        if (d.erro) { c.innerHTML = `<div class="feedback errado">❌ ${d.erro}</div>`; return; }
        mostrarQuiz(d);
    } catch (e) { c.innerHTML = `<div class="feedback errado">❌ Erro.</div>`; }
}

let acertos = 0, total = 0;
function mostrarQuiz(d) {
    acertos = 0; total = d.perguntas.length; explicacaoAtual = d.explicacao;
    let h = `<div class="quiz-explicacao"><strong>📖 ${d.explicacao}</strong><br>
        <button class="btn-ouvir" id="btnOuvir" onclick="ouvirExplicacao()">🔊 Ouvir</button></div>`;
    d.perguntas.forEach((p, i) => {
        h += `<div class="pergunta">${i+1}. ${p.p}</div>`;
        p.opcoes.forEach((op, j) => {
            h += `<button class="opcao" id="op-${i}-${j}" onclick="responder(${i},${j},${p.certa})">${op}</button>`;
        });
        h += `<div class="feedback" id="fb${i}" style="display:none;"></div>`;
    });
    h += '<div id="resultadoFinal"></div>';
    document.getElementById('quizConteudo').innerHTML = h;
}

function ouvirExplicacao() {
    const b = document.getElementById('btnOuvir');
    if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); b.classList.remove('falando'); return; }
    const u = new SpeechSynthesisUtterance(explicacaoAtual);
    u.lang = 'pt-BR';
    u.onstart = () => b.classList.add('falando');
    u.onend = () => b.classList.remove('falando');
    window.speechSynthesis.speak(u);
}

function responder(i, j, certa) {
    const fb = document.getElementById('fb'+i);
    for (let k=0;k<4;k++) { const btn = document.getElementById(`op-${i}-${k}`); if (btn) btn.disabled = true; }
    if (j === certa) {
        document.getElementById(`op-${i}-${j}`).classList.add('certa');
        fb.className = 'feedback certo'; fb.textContent = '✅ Acertou!'; acertos++;
    } else {
        document.getElementById(`op-${i}-${j}`).classList.add('errada');
        document.getElementById(`op-${i}-${certa}`).classList.add('certa');
        fb.className = 'feedback errado'; fb.textContent = '❌ Errou.';
    }
    fb.style.display = 'block';
    const resp = document.querySelectorAll('.feedback[style*="display: block"]').length;
    if (resp === total) {
        const pct = Math.round((acertos/total)*100);
        document.getElementById('resultadoFinal').innerHTML =
            `<div class="resultado-final"><div class="nota">${acertos}/${total}</div>
             <div>${pct}% de acerto</div></div>`;
    }
}

// =====================
// HUMOR (local)
// =====================
function abrirBemEstar() {
    document.getElementById('modalHumor').classList.add('aberto');
    carregarHistoricoHumor();
}

async function registrarHumor(nota) {
    const motivo = document.getElementById('humorMotivo').value.trim();
    humor.unshift({ nota: nota, motivo: motivo, data: dataAgora() });
    if (humor.length > 50) humor = humor.slice(0, 50);
    lsSet(LS_HUMOR, humor);

    let frase;
    if (nota <= 3) frase = "Respira fundo. Você já superou coisas maiores. 💙";
    else if (nota <= 7) frase = "Dia médio também é dia. Segue em frente. 🌤️";
    else frase = "Que bom te ver bem! Aproveita esse dia. ☀️";
    document.getElementById('humorResposta').textContent = frase;
    document.getElementById('humorMotivo').value = '';
    carregarHistoricoHumor();
}

function carregarHistoricoHumor() {
    const div = document.getElementById('historicoHumor');
    if (!humor.length) { div.innerHTML = '<em>Nenhum registro.</em>'; return; }
    div.innerHTML = humor.slice(0, 10).map(x =>
        `<div class="historico-item"><strong>${x.data}</strong> — Nota: ${x.nota}/10
         ${x.motivo ? '<br><em>'+x.motivo+'</em>' : ''}</div>`).join('');
}

async function analisarHumor() {
    const div = document.getElementById('humorResposta');
    if (!humor.length) { div.textContent = 'Registre seu humor primeiro!'; return; }
    div.textContent = '🔍 Analisando...';
    try {
        const r = await fetch('/api/humor/analise', { method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ registros: humor.slice(0, 10) }) });
        const d = await r.json();
        div.textContent = d.analise || d.erro;
    } catch {
        div.textContent = '❌ Erro ao analisar.';
    }
}

// =====================
// MURAL (local — diário pessoal)
// =====================
function abrirMural() {
    document.getElementById('modalMural').classList.add('aberto');
    carregarMural();
}

function salvarMural() {
    const t = document.getElementById('muralTexto').value.trim();
    if (!t) return;
    mural.unshift({ texto: t, data: dataAgora() });
    if (mural.length > 100) mural = mural.slice(0, 100);
    lsSet(LS_MURAL, mural);
    document.getElementById('muralTexto').value = '';
    carregarMural();
}

function carregarMural() {
    const l = document.getElementById('muralLista');
    const i = document.getElementById('muralInfo');
    if (!mural.length) { l.innerHTML = '<em>Nada guardado ainda.</em>'; i.textContent = ''; return; }
    i.textContent = `Você tem ${mural.length} registros no seu diário.`;
    l.innerHTML = mural.map(x =>
        `<div style="padding:8px;background:#f0fdfd;margin:5px 0;border-radius:8px;">
         <strong>${x.data}</strong><br>${x.texto}</div>`).join('');
}

// =====================
// MEMÓRIA (local)
// =====================
function abrirMemoria() {
    document.getElementById('modalMemoria').classList.add('aberto');
    carregarMemoria();
}

function carregarMemoria() {
    document.getElementById('memNome').value = memoria.nome || '';
    document.getElementById('memGostos').value = memoria.gostos || '';
    personalidadeEscolhida = memoria.personalidade || 'padrao';
    ['padrao','bobao','serio','curioso'].forEach(p =>
        document.getElementById('per-'+p).classList.toggle('selecionado', p === personalidadeEscolhida));
}

function escolherPerso(p) {
    personalidadeEscolhida = p;
    ['padrao','bobao','serio','curioso'].forEach(x =>
        document.getElementById('per-'+x).classList.toggle('selecionado', x === p));
}

function salvarMemoria() {
    memoria.nome = document.getElementById('memNome').value.trim();
    memoria.gostos = document.getElementById('memGostos').value.trim();
    memoria.personalidade = personalidadeEscolhida;
    lsSet(LS_MEM, memoria);
    alert('Memória salva! 🧠');
}

function limparHistorico() {
    if (!confirm('Limpar histórico do chat?')) return;
    memoria.historico = [];
    lsSet(LS_MEM, memoria);
    chat.innerHTML = '';
    adicionarMsg('Olá! Sou o Prisma. Como posso ajudar? 🐾', 'prisma');
    alert('Histórico limpo!');
}

// =====================
// NAVEGAÇÃO
// =====================
function abrirChat() { ['modalQuiz','modalHumor','modalMural','modalMemoria'].forEach(fecharModal); }
function fecharModal(id) { window.speechSynthesis.cancel(); document.getElementById(id).classList.remove('aberto'); }

// =====================
// RESTAURA HISTÓRICO AO ABRIR
// =====================
(function restaurar() {
    if (memoria.historico && memoria.historico.length) {
        memoria.historico.slice(-10).forEach(h => {
            if (h.role === 'user') adicionarMsg(h.content, 'usuario');
            else if (h.role === 'assistant') adicionarMsg(h.content, 'prisma');
        });
    }
})();
</script>
